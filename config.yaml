# SDXL图像修复模型微调配置

# 模型配置
pretrained_model_name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
output_dir: "./sdxl-inpaint-finetuned"

# 数据配置
train_data_dir: "./data/train"
resolution: 1024
center_crop: false

# 训练配置
train_batch_size: 1
max_train_steps: 10000
gradient_accumulation_steps: 4
learning_rate: 0.00001
lr_scheduler: "cosine"
lr_warmup_steps: 500
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 0.01
adam_epsilon: 1.0e-08
max_grad_norm: 1.0

# 混合精度训练
mixed_precision: "fp16"

# 数据加载配置
dataloader_num_workers: 4

# 日志和保存配置
logging_steps: 100
save_steps: 1000
seed: 42

# Wandb配置
use_wandb: false
wandb_project: "sdxl-inpaint-finetune"
wandb_run_name: null

# 数据增强配置
mask_generation_strategy: "random"
mask_probability: 0.5
min_mask_ratio: 0.1
max_mask_ratio: 0.5

# 验证配置
validation_steps: 500
num_validation_images: 4

# 其他配置
gradient_checkpointing: true
use_ema: false
ema_decay: 0.999